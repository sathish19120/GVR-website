<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Core SEO tags — this is what Google actually shows in search results -->
  <title>Green Village Rice — Farm Fresh Sona Masoori Rice Delivery in Hyderabad</title>
  <meta name="description" content="Farm-fresh Sona Masoori rice sourced directly from Nalgonda, Khammam & Warangal farms in Telangana. Small-batch milled, QR-traceable, delivered fresh to Hyderabad, Vijayawada, Kadapa, Anantapur, Tadipatri & Jammalamadugu." />
  <meta name="keywords" content="rice delivery Hyderabad, Sona Masoori rice, farm fresh rice, Telangana rice delivery, GVR, Green Village Rice" />

  <!-- Open Graph tags — controls how the link looks when shared on
       WhatsApp, Facebook, Twitter/X etc. Without these, shared links
       show a blank/generic preview instead of your brand. -->
  <meta property="og:title" content="Green Village Rice — Farm Fresh Rice Delivered" />
  <meta property="og:description" content="Farm-fresh Sona Masoori rice, direct from Telangana farms to your kitchen. No middlemen, full traceability." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_IN" />
  <!-- Once you have a logo/banner image hosted somewhere permanent,
       add: <meta property="og:image" content="https://yourdomain/og-image.png" /> -->

  <!-- Helps Google understand this is a local business — genuinely
       useful for local search ranking, costs nothing to include -->
  <meta name="geo.region" content="IN-TG" />
  <meta name="geo.placename" content="Hyderabad" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
